# Disposable Ubuntu 24.04 ARM64 VM template for receiptd v1.6 evaluation.
# Zero host mounts: no host credentials, host sessions, or host home paths exposed.
minimumLimaVersion: "2.0.0"
vmType: "vz"
arch: "aarch64"

images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
    digest: "sha256:50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e"

cpus: 2
memory: "4GiB"
disk: "20GiB"

# Explicitly disable all host filesystem mounts.
mounts: []

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq --no-install-recommends python3 python3-venv git curl ca-certificates iptables iproute2 cron docker.io busybox-static
      systemctl start cron docker
      chmod 666 /var/run/docker.sock
